[build]
target = "wasm32-unknown-emscripten"

[target.wasm32-unknown-emscripten]
rustflags = [
    "-C", "panic=abort",
    "-C", "link-args=-sERROR_ON_UNDEFINED_SYMBOLS=0 -sSUPPORT_LONGJMP=wasm",
]
# panic=abort: no Rust unwinding.
# SUPPORT_LONGJMP=wasm: implement setjmp/longjmp via WASM EH (new-format exnref,
#   generated by emscripten 5.x / LLVM 23).  wasmtime loads the module with
#   wasm_exceptions(true) so it understands these instructions at runtime.
