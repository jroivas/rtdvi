[build]
target = "wasm32-unknown-emscripten"

[target.wasm32-unknown-emscripten]
rustflags = [
    "-C", "panic=abort",
    "-C", "link-args=-sERROR_ON_UNDEFINED_SYMBOLS=0 -sSUPPORT_LONGJMP=0",
]
# panic=abort: no Rust unwinding.
# SUPPORT_LONGJMP=0: disable setjmp/longjmp (longjmp → trap).
# Lua errors propagate as WASM traps caught by jvim as plugin errors.
# No EMCC_CFLAGS: C code compiled without -fwasm-exceptions so Lua functions
# generate no WASM EH; remaining Rust std EH is stripped by wasm-opt --strip-eh.
