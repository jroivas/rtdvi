[package]
name = "hello-rs"
version = "0.1.0"
edition = "2021"
description = "Example rtdvi plugin — greeting and word count"

# cdylib produces the .wasm binary. The lib name sets the output filename:
# target/wasm32-unknown-unknown/release/hello.wasm
[lib]
name = "hello"
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
strip = true
