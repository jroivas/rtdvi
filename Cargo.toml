[package]
name = "rtdvi"
version = "0.1.0"
edition = "2021"
description = "Small modal text editor (vim-like) with an extensible core" # rtd = ready-to-drink
license = "MIT"
repository = "https://github.com/jroivas/rtdvi"
homepage = "https://rtdvi.com"

[[bin]]
name = "rtdvi"
path = "src/main.rs"

[features]
default = ["runtime-wasmtime"]
# `plugins` is the whole plugin subsystem (WASM runtime + optional Lua). It is
# enabled automatically by any runtime/engine below; building with NONE of them
# (e.g. `--no-default-features`) disables plugins — and therefore Lua — entirely.
plugins          = []
runtime-wasmtime = ["plugins", "dep:wasmtime"]
runtime-wasmi    = ["plugins", "dep:wasmi"]
# Lua is an add-on to the plugin system. It only activates when a WASM runtime
# is also present; enabling `lua-engine` with no runtime leaves Lua disabled
# (the plugin system, and therefore Lua, is off).
lua-engine       = ["dep:mlua"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ropey = "1.6"
memmap2 = "0.9"
memchr = "2"
regex = "1.11"
unicode-width = "0.2"
unicode-segmentation = "1.12"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
mime_guess = "2"
serde_json = "1"
lsp-types = "0.95"
fuzzy-matcher = "0.3"
ignore = "0.4"
wasmtime = { version = "45", optional = true, default-features = false, features = ["runtime", "cranelift", "std", "anyhow", "gc", "gc-null"] }
wasmi    = { version = "1.0.9", optional = true, features = ["wat"] }
mlua = { version = "0.11", features = ["lua54", "vendored"], optional = true }

[dev-dependencies]
tempfile = "3"
wat = "1.250.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
